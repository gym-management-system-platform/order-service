version: '3.8'

services:
  postgres-order:
    image: postgres:15
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: order_service_user
      POSTGRES_PASSWORD: order_service_password
    ports:
      - "6433:5432"
    volumes:
      - order_data:/var/lib/postgresql/data

  order-service:
    build: .
    container_name: order-service
    depends_on:
      - postgres-order
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_service_db
      SPRING_DATASOURCE_USERNAME: order_service_user
      SPRING_DATASOURCE_PASSWORD: order_service_password
    ports:
      - "8082:8080"
    volumes:
      - ~/.m2:/home/gradle/.m2:ro  # Монтируем локальный .m2 как read-only

volumes:
  order_data: